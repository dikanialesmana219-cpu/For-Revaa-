<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dudu 🤍</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dudu-page">

    <main class="dudu-container">

        <div class="floating-heart">♡</div>
        <div class="floating-heart heart-two">♥</div>

        <div class="dudu-character">
            <img src="dudu.png" alt="Dudu">
        </div>

        <div class="speech-box">

            <p id="duduText">
                Ehh adaaa manusia terindah
                yang mauu lihat wajahnya sendiri yaaa 🤭
            </p>

        </div>

        <div class="heart-form">

            <h2>
                kalo begituu coba tuliskan isi hati
                kamu buat dika di sini 👇👇
            </h2>

            <textarea
                id="heartMessage"
                placeholder="Tulis isi hati kamu di sini..."
            ></textarea>

            <p class="screenshot-text">
                SS halaman ini yaa lalu kirim ke dikaa 😊😊
            </p>

            <button
                id="nextButton"
                class="next-button hidden"
                onclick="goToPage3()">
                NEXT →
            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
